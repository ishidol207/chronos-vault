[package]
name = "threshold-ecdsa-online"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "serde"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
