[package]
name = "threshold-ecdsa"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["js-entropy"]
js-entropy = ["getrandom/js", "libpaillier/wasm"]
flame_it = ["flame", "flamer"]

[dependencies]
threshold-ecdsa-online = { path = "threshold-online" }
getrandom = "0.2"
bincode = "1"
bytemuck = "1.13"
bytemuck_derive = "1.4"
merlin = "3"
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10.8"
hmac = "0.12.1"
sha2 = "0.10.8"
thiserror = "1"
tracing = "0.1.37"
zeroize = "1.5"
itertools = "0.13.0"
flame = { version = "0.2", optional = true }
flamer = { version = "0.3", optional = true }
generic-array = "0.14"
hex = "0.4"
k256 = { version = "0.13", features = ["arithmetic", "sha256", "ecdsa", "serde"] }
p256 = { version = "0.13.2", features = ["arithmetic", "sha256", "ecdsa", "serde"] }
lazy_static = "1"
libpaillier = { version = "0.5", default-features = false, features = ["rust"] }
rayon = "1.11.0"



[dev-dependencies]
hex-literal = "0.4"
rug = { version = "1.16", default-features = false, features = ["integer", "rand"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
